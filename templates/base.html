{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Accueil{% endblock %} — LITRevu</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'home' %}" class="logo">LITRevu</a>

        {% if user.is_authenticated %}
            <nav aria-label="Navigation principale">
                <ul class="pile">
                    <li><a href="{% url 'flux' %}" class="livre-plat livre-1">Mon fil</a></li>
                    <li><a href="{% url 'my_posts' %}" class="livre-plat livre-2">Mes correspondances</a></li>
                    <li><a href="{% url 'follow_users' %}" class="livre-plat livre-3">Mes cercles</a></li>
                </ul>

                <ul class="courrier">
                    <li>
                        <a href="{% url 'create_ticket' %}" class="page">
                            <span class="page-titre">Solliciter</span>
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'create_ticket_and_review' %}" class="page">
                            <span class="page-titre">Chroniquer</span>
                        </a>
                    </li>
                </ul>

                <div class="user-menu">
                    <span class="livre-plat livre-user">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="interrupteur">Sortir</button>
                    </form>
                </div>
            </nav>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
