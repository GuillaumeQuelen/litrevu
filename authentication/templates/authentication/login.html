{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
    <h1>Connexion</h1>

    {% if message %}
        <p class="message" role="alert">{{ message }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>
{% endblock %}
