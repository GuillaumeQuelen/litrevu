<div class="demande">
    <div class="livre livre-couleur-{% cycle '1' '2' '3' '4' %}">
        {% if ticket.image %}
            <img src="{{ ticket.image.url }}" alt="Couverture de {{ ticket.title }}" class="livre-couverture">
        {% else %}
            <span class="livre-titre">{{ ticket.title }}</span>
        {% endif %}
    </div>

    <div class="post-it">
        <h3>{{ ticket.title }}</h3>

        {% if ticket.description %}
            <div class="post-it-texte">{{ ticket.description|linebreaks }}</div>
        {% endif %}

        <p class="post-it-signature {% if ticket.user == user %}signature-moi{% endif %}">
            {% if ticket.user == user %}Vous{% else %}{{ ticket.user.username }}{% endif %}
        </p>
    </div>
</div>
